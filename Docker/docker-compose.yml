services:
  # FastAPI Backend only
  backend:
    build:
      context: ..
      dockerfile: Docker/Dockerfile
    container_name: tripplanner-backend
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
